<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Character Builder - 5etools</title>

	<link rel="stylesheet" href="css/bootstrap.css">
	<link rel="stylesheet" href="css/main.css">
	<link rel="stylesheet" href="css/charbuilder.css">

	<script type="text/javascript" src="sw-injector.js"></script>
	<script blocking="render" type="module" src="js/styleswitch.js"></script>
	<script type="text/javascript" src="js/navigation.js"></script>
	<script type="module" src="js/browsercheck.js"></script>
</head>

<body data-page="charbuilder">
<div class="overlay-noise no-print"></div>

<div class="viewport-wrapper">
	<header class="hidden-xs hidden-sm page__header">
		<div class="container ve-flex-v-baseline">
			<h1 class="page__title ve-no-wrap ve-my-0">Character Builder</h1>
			<p class="page__subtitle ve-no-wrap ve-my-0">SRD por padrão. Salva no browser.</p>
		</div>
	</header>

	<nav class="container page__nav" id="navigation">
		<ul class="nav nav-pills page__nav-inner" id="navbar"></ul>
	</nav>

	<div class="view-col-group--cancer ve-h-100 mh-0">
		<div class="container view-col-wrapper view-col-wrapper--cancer">

			<!-- COLUNA ESQUERDA -->
			<div class="view-col" id="listcontainer">
				<div class="cb__controls" id="cb__controls">
					<div class="cb__tabs" id="cb__tabs">
						<button class="ve-btn ve-btn-default ve-btn-sm ve-active" data-cb-tab="species">Species</button>
						<button class="ve-btn ve-btn-default ve-btn-sm" data-cb-tab="subrace" disabled>Subrace</button>

						<button class="ve-btn ve-btn-default ve-btn-sm" data-cb-tab="class">Class</button>
						<button class="ve-btn ve-btn-default ve-btn-sm" data-cb-tab="subclass" disabled>Subclass</button>

						<button class="ve-btn ve-btn-default ve-btn-sm" data-cb-tab="background">Background</button>
						<button class="ve-btn ve-btn-default ve-btn-sm" data-cb-tab="feats">Feats</button>
					</div>

					<div class="cb__controls-rhs">
						<label class="cb__toggle ve-flex ve-flex-v-center" title="Filtrar só SRD/basic rules">
							<input type="checkbox" id="cb__toggle_srd" checked>
							<span class="ve-ml-1">SRD only</span>
						</label>

						<!-- ✅ Filtro padrão 5etools (FilterBox/SourceFilter) -->
						<div class="cb__controls-row">
							<button class="ve-btn ve-btn-default ve-btn-xs" id="cb__btn_filter_open" title="Filter">
								<span class="glyphicon glyphicon-filter"></span>
							</button>
							<button class="ve-btn ve-btn-default ve-btn-xs" id="cb__btn_filter_reset" title="Reset Filters">
								<span class="glyphicon glyphicon-refresh"></span>
							</button>
						</div>

						<div id="cb__wrp_filter_pills" class="cb__wrp-filter-pills"></div>
					</div>
				</div>

				<div id="cb__list" class="list list--stats"></div>
			</div>

			<!-- COLUNA DIREITA -->
			<div id="contentwrapper" class="view-col">
				<div class="cb__topbar ve-flex ve-flex-v-center">
					<input id="cb__name" class="ve-form-control input-sm cb__input-name" placeholder="Character name">

					<div class="ve-ml-auto ve-flex ve-flex-v-center cb__topbar-actions">
						<button class="ve-btn ve-btn-default ve-btn-xs" id="cb__btn_update" disabled>Update</button>
						<button class="ve-btn ve-btn-primary ve-btn-xs" id="cb__btn_save_new">Save as New</button>
						<button class="ve-btn ve-btn-danger ve-btn-xs" id="cb__btn_reset">Reset</button>
					</div>
				</div>

				<!-- AVISO SRD -->
				<div class="cb__notice cb__notice--hidden" id="cb__notice_srd">
					<span class="glyphicon glyphicon-info-sign"></span>
					<span>
						<b>SRD only</b> está ligado — conteúdo não-SRD (ex.: várias subraças/subclasses do PHB) ficará oculto.
					</span>
				</div>

				<div class="cb__chips" id="cb__chips"></div>

				<div class="cb__preview">
					<table class="ve-w-100 ve-stats" id="cb__preview_tbl">
						<tr><td class="initial-message initial-message--med">Selecione algo na lista para ver detalhes aqui.</td></tr>
					</table>
				</div>
			</div>

		</div>
	</div>
</div>

<!-- base -->
<script type="text/javascript" defer src="js/parser.js"></script>
<script type="text/javascript" defer src="js/utils.js"></script>
<script type="text/javascript" defer src="js/utils-ui.js"></script>
<script type="text/javascript" defer src="lib/localforage.js"></script>

<script type="module" src="js/utils-config.js"></script>

<!-- renderer -->
<script type="text/javascript" defer src="js/render.js"></script>
<script type="text/javascript" defer src="js/render-dice.js"></script>
<script type="text/javascript" defer src="js/render-markdown.js"></script>
<script type="module" src="js/shim-esmodules.js"></script>

<!-- ✅ Hist + Brew/Prerelease + Filters padrão -->
<script type="text/javascript" defer src="js/hist.js"></script>
<script type="module" src="js/utils-brew.js"></script>
<script type="module" src="js/filter.js"></script>

<!-- app -->
<script type="module" src="js/charbuilder.js"></script>
</body>
</html>

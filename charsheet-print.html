<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Character Sheet (Print)</title>

	<script>
		(() => {
			const url = new URL(location.href);

			// defaults
			if (!url.searchParams.has("lang")) url.searchParams.set("lang", "ptbr");
			if (!url.searchParams.has("features")) url.searchParams.set("features", "1");

			// se mudou algo, recarrega uma vez com os params certos
			if (url.toString() !== location.href) location.replace(url.toString());
		})();
	</script>

	<!-- fonts usados pelo template -->
	<link href="https://fonts.googleapis.com/css?family=UnifrakturMaguntia|Cinzel|Great+Vibes|Old+Standard+TT" rel="stylesheet">

	<!-- GPL template CSS -->
	<link rel="stylesheet" href="css/gpl/dungeontiger-character.css">
	<link rel="stylesheet" href="css/charsheet-print-gpl-overrides.css?v=dev1">
	<!-- storage -->
	<script defer src="js/parser.js"></script>
	<script defer src="js/utils.js"></script>
	<script defer src="js/utils-ui.js"></script>
	<script defer src="lib/localforage.js"></script>
	<script defer src="js/utils-dataloader.js"></script>

	<script type="module" src="js/utils-brew.js"></script>
	<script type="module" src="js/utils-config.js"></script>

	<script defer src="js/render.js"></script>
	<script defer src="js/render-dice.js"></script>
	<script defer src="js/render-markdown.js"></script>
	<script type="module" src="js/shim-esmodules.js"></script>

	<!-- seu print -->
	<script type="module" src="js/charsheet-print-gpl.js?v=dev-brew-1"></script>
</head>
<body>
<div id="gpl_sheet"></div>

<script type="module" src="js/charsheet-print-gpl.js"></script>
</body>
</html>
